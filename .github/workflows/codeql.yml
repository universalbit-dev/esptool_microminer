name: "CodeQL Advanced"

on:
  push:
    branches: [ "microminer" ]
  pull_request:
    branches: [ "microminer" ]
  schedule:
    - cron: '36 12 * * 1'

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ${{ (matrix.language == 'swift' && 'macos-latest') || 'ubuntu-latest' }}
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
        - language: actions
          build-mode: none
        - language: c-cpp
          build-mode: manual      # CHANGED
        - language: python
          build-mode: none

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    # Add any setup steps before running the `github/codeql-action/init` action.
    # (example: setup toolchains/dependencies here if needed!)

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v4
      with:
        languages: ${{ matrix.language }}
        build-mode: ${{ matrix.build-mode }}
      # You can uncomment and specify custom queries if needed:
      # queries: security-extended,security-and-quality

    # Run the actual C/C++ build commands for CodeQL to scan - required for 'manual' build mode!
    - name: Run manual build steps
      if: matrix.build-mode == 'manual'
      shell: bash
      run: |
        mkdir -p build
        cd build
        cmake ..
        make -j$(nproc)
      # --- If your project doesn't use CMake, replace the cmake+make lines above
      # --- with the actual build commands (like "make all" etc) for your project.

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v4
      with:
        category: "/language:${{matrix.language}}"
